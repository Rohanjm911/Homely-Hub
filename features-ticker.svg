<svg width="760" height="130" viewBox="0 0 760 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulseCard1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes pulseCard2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes pulseCard3 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes iconSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes beaconGlow { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.3); } }
    .card-1 { animation: pulseCard1 4s ease-in-out infinite; }
    .card-2 { animation: pulseCard2 4s ease-in-out infinite 0.7s; }
    .card-3 { animation: pulseCard3 4s ease-in-out infinite 1.4s; }
    .beacon { animation: beaconGlow 2.5s ease-in-out infinite; }
  </style>

  <!-- Feature 1: Zero Overlap Guard -->
  <g class="card-1" transform="translate(10, 10)">
    <rect width="230" height="110" rx="18" fill="#0b1120" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.2" />
    <circle cx="36" cy="36" r="16" fill="rgba(99, 102, 241, 0.15)" />
    <!-- Shield Icon -->
    <path d="M36 26 L44 29 V36 C44 41 40 45 36 47 C32 45 28 41 28 36 V29 L36 26 Z" stroke="#818cf8" stroke-width="2" stroke-linejoin="round" fill="none" />
    <path d="M33 36 L35 38 L39 34" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Glowing beacon dot -->
    <circle cx="48" cy="24" r="3" fill="#10b981" class="beacon" />
    <text x="36" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Double-Booking Guard</text>
    <text x="36" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Atomic reservation sync</text>
  </g>

  <!-- Feature 2: Groq AI Description Writer -->
  <g class="card-2" transform="translate(265, 10)">
    <rect width="230" height="110" rx="18" fill="#0b1120" stroke="rgba(255, 51, 58, 0.25)" stroke-width="1.2" />
    <circle cx="36" cy="36" r="16" fill="rgba(255, 51, 58, 0.15)" />
    <!-- Sparkles Icon -->
    <path d="M36 26 L38 32 L44 34 L38 36 L36 42 L34 36 L28 34 L34 32 Z" fill="#ff333a" />
    <circle cx="48" cy="24" r="3" fill="#ff333a" class="beacon" />
    <text x="36" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">AI Listing Copywriter</text>
    <text x="36" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Zero-hallucination Groq AI</text>
  </g>

  <!-- Feature 3: Smart Itinerary Engine -->
  <g class="card-3" transform="translate(520, 10)">
    <rect width="230" height="110" rx="18" fill="#0b1120" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.2" />
    <circle cx="36" cy="36" r="16" fill="rgba(16, 185, 129, 0.15)" />
    <!-- Compass Icon -->
    <circle cx="36" cy="36" r="11" stroke="#34d399" stroke-width="1.8" fill="none" />
    <polygon points="36,29 39,36 36,34 33,36" fill="#34d399" />
    <polygon points="36,43 39,36 36,38 33,36" fill="#10b981" />
    <circle cx="48" cy="24" r="3" fill="#38bdf8" class="beacon" />
    <text x="36" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">AI Trip Planner</text>
    <text x="36" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Daily budget & map engine</text>
  </g>
</svg>
