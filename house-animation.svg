<svg width="600" height="280" viewBox="0 0 600 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes floatHouse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes smokeDrift {
      0% { transform: translateY(0px) scale(0.6); opacity: 0.8; }
      50% { transform: translateY(-16px) translateX(6px) scale(1.1); opacity: 0.5; }
      100% { transform: translateY(-34px) translateX(14px) scale(1.6); opacity: 0; }
    }
    @keyframes windowPulse {
      0%, 100% { fill-opacity: 0.95; filter: drop-shadow(0 0 10px rgba(254, 240, 138, 0.9)); }
      50% { fill-opacity: 0.55; filter: drop-shadow(0 0 3px rgba(254, 240, 138, 0.4)); }
    }
    @keyframes starPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes beamSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .house-group { animation: floatHouse 5s ease-in-out infinite; transform-origin: 300px 200px; }
    .smoke-1 { animation: smokeDrift 3.2s infinite ease-out; }
    .smoke-2 { animation: smokeDrift 3.2s infinite 1.1s ease-out; }
    .smoke-3 { animation: smokeDrift 3.2s infinite 2.1s ease-out; }
    .glow-win { animation: windowPulse 3.5s ease-in-out infinite alternate; }
    .star-a { animation: starPulse 2.8s infinite ease-in-out; }
    .star-b { animation: starPulse 3.8s infinite 1s ease-in-out; }
    .star-c { animation: starPulse 4.2s infinite 2s ease-in-out; }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="600" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060813" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="300" y1="50" x2="300" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glowOrb" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ff333a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#060813" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="islandGrad" x1="180" y1="220" x2="420" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Canvas Background Card with Rounded Borders -->
  <rect width="600" height="280" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Light Sphere -->
  <circle cx="300" cy="140" r="160" fill="url(#glowOrb)" />

  <!-- Constellation / Star Twinkles -->
  <circle cx="80" cy="60" r="2" fill="#818cf8" class="star-a" />
  <circle cx="140" cy="45" r="1.5" fill="#ffffff" class="star-c" />
  <circle cx="520" cy="50" r="2.5" fill="#fef08a" class="star-b" />
  <circle cx="470" cy="90" r="1.8" fill="#818cf8" class="star-a" />
  <circle cx="540" cy="140" r="1.5" fill="#ffffff" class="star-c" />
  <circle cx="65" cy="170" r="1.8" fill="#818cf8" class="star-b" />

  <!-- Brand Watermark in background -->
  <text x="300" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="4" text-anchor="middle" opacity="0.6">HOMELYHUB • LIVE SANCTUARY</text>

  <!-- Interactive Floating House Group -->
  <g class="house-group">
    <!-- Island Platform Shadow -->
    <ellipse cx="300" cy="242" rx="140" ry="18" fill="rgba(0, 0, 0, 0.45)" />
    
    <!-- Island Bedrock -->
    <path d="M170 234 C170 224 235 214 300 214 C365 214 430 224 430 234 C430 246 365 252 300 252 C235 252 170 246 170 234 Z" fill="url(#islandGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

    <!-- Chimney Smoke Stream -->
    <circle cx="236" cy="40" r="5" fill="#e0e7ff" class="smoke-1" />
    <circle cx="237" cy="32" r="6" fill="#c7d2fe" class="smoke-2" />
    <circle cx="239" cy="22" r="7" fill="#a5b4fc" class="smoke-3" />

    <!-- Chimney -->
    <rect x="228" y="56" width="16" height="38" rx="2" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="225" y="52" width="22" height="6" rx="2" fill="#ff333a" />

    <!-- Main Residence Villa -->
    <rect x="220" y="116" width="160" height="106" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
    <line x1="220" y1="142" x2="380" y2="142" stroke="#1e293b" stroke-width="1.5" />
    <line x1="220" y1="170" x2="380" y2="170" stroke="#1e293b" stroke-width="1.5" />
    <line x1="220" y1="198" x2="380" y2="198" stroke="#1e293b" stroke-width="1.5" />

    <!-- Roof -->
    <path d="M202 120 L300 50 L398 120 Z" fill="url(#roofGrad)" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Signature Coral Red Roof Trim -->
    <path d="M198 121 L300 48 L402 121" stroke="#ff333a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Attic Circle Window -->
    <circle cx="300" cy="90" r="13" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <circle cx="300" cy="90" r="8" fill="#fef08a" class="glow-win" />

    <!-- Glowing Living Room Window -->
    <rect x="242" y="140" width="42" height="44" rx="6" fill="#fef08a" stroke="#fbbf24" stroke-width="2" class="glow-win" />
    <line x1="263" y1="140" x2="263" y2="184" stroke="#ca8a04" stroke-width="1.8" />
    <line x1="242" y1="162" x2="284" y2="162" stroke="#ca8a04" stroke-width="1.8" />

    <!-- Welcome Arch Entrance -->
    <path d="M316 222 V156 C316 146 326 138 338 138 C350 138 360 146 360 156 V222 H316 Z" fill="#1e1e24" stroke="#ff333a" stroke-width="2.5" />
    <path d="M324 179 V158 C324 152 330 147 338 147 C346 147 352 152 352 158 V179 H324 Z" fill="#818cf8" fill-opacity="0.4" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="326" cy="189" r="3" fill="#fbbf24" />

    <!-- Porch Lantern -->
    <circle cx="306" cy="150" r="5" fill="#fef08a" class="glow-win" />
    <path d="M306 144 V148" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Garden Plant -->
    <rect x="366" y="206" width="12" height="16" rx="2" fill="#d97706" />
    <circle cx="372" cy="201" r="8" fill="#10b981" />
    <circle cx="370" cy="194" r="5" fill="#34d399" />
  </g>
</svg>
